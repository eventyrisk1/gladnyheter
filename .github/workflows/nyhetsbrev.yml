name: Nyhetsbrev

on:
  schedule:
    - cron: "7 5,6 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Send til ALLE abonnenter nå"
        type: boolean
        default: false
      test_to:
        description: "Send bare en test til denne e-postadressen"
        type: string
        default: ""

jobs:
  nyhetsbrev:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Send Dagens 5 gode
        env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_LIST_ID: ${{ secrets.BREVO_LIST_ID }}
          TEST_TO: ${{ github.event_name == 'workflow_dispatch' && inputs.test_to || '' }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
        run: python scripts/nyhetsbrev.py
